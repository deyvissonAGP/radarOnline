services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy

  # Executa as rotinas pedidas pelos botões da página /rotinas.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/app
    command: php artisan queue:work --timeout=600 --tries=1 --sleep=3
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/app
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
